<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>To Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center">

        <div class="card bg-light rounded-5 w-25 p-4">
            <div class="d-flex align-content-center border-0 justify-content-center">
                <h3 class="fw-bold">TO DO LIST </h3>
                <img src="https://cdn-icons-png.flaticon.com/512/8028/8028200.png" alt="" width="25px" height="25px"
                    class="m-1">
            </div>

            <div class="card-body">
                <div class="search position-relative">
                    <input type="search" name="search" id="inputBox" placeholder="Ajouter votre tâche"
                        class="border-0 rounded-pill p-3 w-100 search-input">

                    <button class="btn rounded-pill btn-add" onclick="createTask()" >Ajouter</button>
                </div>

                <ul id="task-list" class="ps-2 mt-2">

                </ul>
            </div>


        </div>

    </div>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.min.js'></script>
    <script src="./script.js"></script>

</body>

</html>
